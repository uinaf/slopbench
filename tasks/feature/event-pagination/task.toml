version = "1.3"
multi_step_reward_strategy = "final"

[task]
name = "uinaf/event-pagination"
description = "Add deterministic pagination and consolidate repository automation"

[[task.authors]]
name = "uinaf"

[metadata]
slopbench_task_id = "slopbench/feature/event-pagination"
slopbench_task_version = "1.1.0"

[[steps]]
name = "implement"
min_reward = 1.0

[steps.verifier]
env = { SLOPBENCH_PHASE = "implement" }

[[steps]]
name = "review"
min_reward = 1.0

[steps.verifier]
env = { SLOPBENCH_PHASE = "review" }

[[steps]]
name = "integrate"

[steps.verifier]
env = { SLOPBENCH_PHASE = "integrate" }

[agent]
timeout_sec = 300.0
network_mode = "no-network"

[verifier]
timeout_sec = 120.0
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
network_mode = "no-network"
cpus = 1
memory_mb = 512
storage_mb = 1024
workdir = "/app"

[environment]
build_timeout_sec = 600.0
network_mode = "no-network"
cpus = 1
memory_mb = 512
storage_mb = 1024
workdir = "/app"

[solution]
