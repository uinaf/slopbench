version = "1.3"

[task]
name = "uinaf/event-summary-tracer"
description = "Implement a deterministic event summarizer and emit a SlopBench receipt"

[[task.authors]]
name = "uinaf"

[metadata]
slopbench_task_id = "slopbench/tracer/event-summary"
slopbench_task_version = "1.0.0"

[agent]
timeout_sec = 300.0
network_mode = "no-network"

[verifier]
timeout_sec = 120.0
