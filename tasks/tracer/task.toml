[verifier.environment]
network_mode = "no-network"
cpus = 2
memory_mb = 2048
storage_mb = 4096
workdir = "/app"

[environment]
build_timeout_sec = 600.0
network_mode = "no-network"
cpus = 2
memory_mb = 2048
storage_mb = 4096
workdir = "/app"

